<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stocks Tracker</title>
  <style>
    :root {
      color: #172033;
      background: #f4f7fb;
      font-family: system-ui, sans-serif;
    }

    body {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    h1 { margin-bottom: 0.35rem; }
    p { color: #5b6578; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin: 1.5rem 0;
    }

    button {
      padding: 0.7rem 1.1rem;
      border: 0;
      border-radius: 6px;
      color: white;
      background: #2563eb;
      cursor: pointer;
      font-size: 0.95rem;
    }

    button:hover { background: #1d4ed8; }
    button.secondary { color: #1d4ed8; background: #dbeafe; }
    button.secondary:hover { background: #bfdbfe; }

    .table-wrapper {
      overflow-x: auto;
      border: 1px solid #dbe2ee;
      border-radius: 8px;
      background: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    th, td {
      padding: 0.9rem 1rem;
      border-bottom: 1px solid #e8edf5;
      text-align: left;
    }

    th {
      color: #5b6578;
      background: #f8fafc;
      font-size: 0.85rem;
      text-transform: uppercase;
    }

    tr:last-child td { border-bottom: 0; }
    .drop { color: #dc2626; font-weight: 600; }
    .positive { color: #15803d; font-weight: 600; }
    #status { min-height: 1.5rem; margin: 0.75rem 0; }
  </style>
</head>
<body>
  <h1>Stocks Tracker</h1>
  <p>Track current prices against each stock's reference high.</p>

  <div class="actions">
    <button id="updatePricesBtn">Update prices</button>
    <button id="filterBtn" class="secondary">Show 5%+ drops</button>
  </div>

  <p id="status" aria-live="polite"></p>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
           <th>Symbol</th>
          <th>Name</th>
           <th>Current price</th>
          <th>Reference high</th>
          <th>Distance</th>
        </tr>
      </thead>
      <tbody id="stocksTableBody"></tbody>
    </table>
  </div>

  <script>
    let showDropsOnly = false;
    let stocks = [];

    async function fetchStocks() {
      const endpoint = showDropsOnly
        ? "/api/stocks/below-threshold"
        : "/api/stocks";
      const response = await fetch(endpoint);
      if (!response.ok) {
        throw new Error(`Request failed with status ${response.status}`);
      }
      stocks = await response.json();
    }

    function formatPrice(price) {
      return price === null ? "-" : `$${Number(price).toFixed(2)}`;
    }

    function formatDistance(distance) {
      return distance === null ? "-" : `${Number(distance).toFixed(1)}%`;
    }

    function renderTable() {
      const tableBody = document.getElementById("stocksTableBody");
      tableBody.innerHTML = stocks.map((stock) => {
        const distance = stock.distance_pct === null
          ? null
          : Number(stock.distance_pct);
        const distanceClass = distance !== null && distance < 0 ? "drop" : "positive";
        return `
          <tr>
            <td><strong>${stock.symbol}</strong></td>
            <td>${stock.name}</td>
            <td>${formatPrice(stock.current_price)}</td>
            <td>${formatPrice(stock.reference_high)}</td>
            <td class="${distanceClass}">${formatDistance(stock.distance_pct)}</td>
          </tr>
        `;
      }).join("");

      if (stocks.length === 0) {
        const message = showDropsOnly
          ? "No stocks are down 5% or more."
          : "No stocks found.";
        tableBody.innerHTML = `<tr><td colspan="5">${message}</td></tr>`;
      }
    }

    async function loadStocks(statusMessage = "") {
      try {
        await fetchStocks();
        renderTable();
        document.getElementById("status").textContent = statusMessage;
      } catch (error) {
        document.getElementById("status").textContent = `Unable to load stocks: ${error.message}`;
      }
    }

    document.getElementById("updatePricesBtn").addEventListener("click", async () => {
      const button = document.getElementById("updatePricesBtn");
      button.disabled = true;
      document.getElementById("status").textContent = "Updating prices...";
      try {
        const response = await fetch("/api/check", { method: "POST" });
        if (!response.ok) {
          throw new Error(`Request failed with status ${response.status}`);
        }
        await loadStocks("Prices updated.");
      } catch (error) {
        document.getElementById("status").textContent = `Unable to update prices: ${error.message}`;
      } finally {
        button.disabled = false;
      }
    });

    document.getElementById("filterBtn").addEventListener("click", async (event) => {
      showDropsOnly = !showDropsOnly;
      event.currentTarget.textContent = showDropsOnly
        ? "Show all stocks"
        : "Show 5%+ drops";
      await loadStocks();
    });

    loadStocks();
  </script>
</body>
</html>
